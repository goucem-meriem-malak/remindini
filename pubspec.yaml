name: remindini
description: Subscription reminder app. Track what you pay, when, and cancel free trials in time.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: assets/logo/icon_background.png
  adaptive_icon_foreground: assets/logo/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#F1ECFF"
  color_dark: "#120E26"
  image: assets/splash/blank.png
  android_12:
    image: assets/splash/blank.png
    icon_background_color: "#F1ECFF"
    icon_background_color_dark: "#120E26"
